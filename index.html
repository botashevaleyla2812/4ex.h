<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="container">
        <div class="header-content">
            <div>
                <div class="subtitle">Покупай. Продавай. Находи.</div>
            </div>

            <button class="header-button" onclick="document.getElementById('adForm').scrollIntoView({behavior: 'smooth'})">
                Продать товар
            </button>
        </div>
    </div>
</header>

<section class="welcome">
    <div class="container">
        <div class="welcome-box">
            <div class="welcome-text">
                <span class="welcome-label">ОНЛАЙН МАРКЕТ</span>
                <h1>Всё нужное<br>в одном месте</h1>
                <p>Просматривайте объявления или добавляйте собственные товары.</p>
            </div>

            <div class="welcome-icon">+</div>
        </div>
    </div>
</section>

<main class="container py-5">

    <div class="row g-5">

        <div class="col-lg-4">

            <div class="form-card">

                <div class="section-number">01</div>

                <h2>Новое объявление</h2>

                <p class="form-description">
                    Добавьте информацию о товаре и фотографию.
                </p>

                <form id="adForm">

                    <div class="field">
                        <label for="title">Название</label>
                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            placeholder="Название товара"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="price">Цена</label>

                        <div class="price-input">
                            <input
                                type="number"
                                id="price"
                                class="form-control"
                                placeholder="0"
                                min="0"
                                step="0.01"
                                required
                            >
                            <span>сом</span>
                        </div>
                    </div>

                    <div class="field">
                        <label for="description">Описание</label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="5"
                            placeholder="Опишите состояние товара..."
                            required
                        ></textarea>
                    </div>

                    <div class="field">
                        <label for="image">Фотография</label>

                        <input
                            type="file"
                            id="image"
                            class="form-control"
                            accept="image/*"
                            required
                        >
                    </div>

                    <button type="submit" class="submit-button">
                        Разместить
                    </button>

                </form>

                <div id="message"></div>

            </div>

        </div>

        <div class="col-lg-8">

            <div class="ads-heading">

                <div>
                    <div class="section-number">02</div>
                    <h2>Объявления</h2>
                    <p>Последние товары от пользователей</p>
                </div>

                <button class="reload-button" onclick="loadAds()">
                    Обновить
                </button>

            </div>

            <div id="total" class="total-count"></div>

            <div id="adsList"></div>

        </div>

    </div>

</main>

<footer>
    <div class="container">
        MARKET+ — доска объявлений
    </div>
</footer>

<script src="script.js"></script>

</body>
</html>
